<svg xmlns="http://www.w3.org/2000/svg" width="680" height="655" viewBox="0 0 680 655" role="img" aria-labelledby="title description">
  <title id="title">Axians color palette</title>
  <desc id="description">Main and secondary colors with four progressively lighter shades of each color.</desc>
